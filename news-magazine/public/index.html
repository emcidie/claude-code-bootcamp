<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Daily Brief</title>
  <meta name="description" content="A magazine of summarised news from sources you trust.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,800;1,600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=Inter:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="masthead">
    <div class="masthead-top">
      <span id="today"></span>
      <span id="updated"></span>
    </div>
    <h1 id="site-title">The Daily Brief</h1>
    <p id="tagline" class="tagline"></p>
    <nav id="sections" class="sections" aria-label="Sections"></nav>
  </header>

  <main id="content" class="content">
    <p class="status">Loading today’s stories…</p>
  </main>

  <footer class="footer">
    <p>Headlines and images belong to their publishers. Summaries are generated automatically — open the full article for the complete story.</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
